# End-to-end overlay: the API trusts the MOCK identity provider and seeds the two mock customers.
# Use together with the base file and both profiles:
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile api --profile e2e up -d --build
# The browser reaches the mock as http://mock-idp:9099 (map it to 127.0.0.1; Playwright does it with --host-resolver-rules).
services:
  financial-transaction-api:
    environment:
      AUTH_ISSUER: http://mock-idp:9099/
      SEED_OWNER_SUB: auth0|mock-user-1
      SEED_SECOND_SUB: auth0|mock-user-2
    depends_on:
      - pg-db
      - kafka
      - mock-idp

  # Optional: run the e2e against the containerised web app instead of `ng serve` (add `--profile web`). The app reads the
  # mock IdP values from the file mounted below; the browser still needs `mock-idp` mapped to 127.0.0.1 (Playwright does it).
  financial-transaction-web:
    volumes:
      - ./app-financial-transaction-service/e2e/web-config.json:/usr/share/nginx/html/config.json:ro

  mock-idp:
    profiles: ["e2e"]
    image: node:22-alpine
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      PORT: "9099"
      PUBLIC_URL: http://mock-idp:9099
    volumes:
      - ./app-financial-transaction-service/e2e/mock-idp:/app:ro
    ports:
      - "9099:9099"
    networks:
      - maianet
