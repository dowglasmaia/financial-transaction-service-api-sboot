# Maia Bank - the whole stack in ONE file: web app, API and every dependency.
#
#   cp .env.example .env                 # once (local, throw-away values)
#   docker compose up -d --build         # web (4200) + API (8088) + PostgreSQL + Kafka + MaiaBank stub
#
# Only the dependencies (API and app run from the IDE / `npm start`):
#   docker compose up -d pg-db zookeeper kafka kafdrop maiabank-api
#
# Automated browser tests (mock identity provider, no password, no Auth0):
#   docker compose --env-file .env --env-file e2e.env --profile e2e up -d --build
# e2e.env only overrides the identity values below; the browser reaches the mock as http://mock-idp:9099
# (map it to 127.0.0.1; Playwright does it with --host-resolver-rules).
#
# Credentials come from the environment (copy .env.example to .env). Nothing secret is stored here.
services:
  # Spring Boot API. SPRING_PROFILES_ACTIVE=local seeds the demo customer (never use that in production).
  financial-transaction-api:
    build:
      context: ./api-financial-transaction-service
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: local        # enables the demo seed data (never use in production)
      DB_URL: jdbc:postgresql://pg-db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAIABANK_URL: http://maiabank-api:8089/api/v1/transactions
      AUTH_ISSUER: ${AUTH_ISSUER:-https://dev-twljocmfwpvlxx1q.eu.auth0.com/}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-https://api.financial-transaction.local}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      SEED_SECOND_SUB: ${SEED_SECOND_SUB:-}       # optional second demo customer (account 3033)
      SEED_OWNER_SUB: ${SEED_OWNER_SUB:-}        # token sub of the demo customer (local profile only)
    networks:
      - maianet
    depends_on:
      pg-db:
        condition: service_healthy
      kafka:
        condition: service_started
      mock-idp:                       # only exists with `--profile e2e`; ignored otherwise
        condition: service_started
        required: false
    # BE-08: the actuator is on its own port (8090, not published); health is what "ready" means for the web app and the e2e.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # The web app: nginx serving the Angular build and forwarding /api/ to the API. It listens on 4200 so the Auth0
  # callback/logout URLs of `ng serve` keep working: stop `npm start` first, or change WEB_PORT and register that origin
  # in Auth0. The public Auth0 values are read from the mounted config.json (public values only, no secret); the e2e
  # points WEB_CONFIG at the mock identity provider.
  financial-transaction-web:
    build:
      context: ./app-financial-transaction-service
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-4200}:80"
    environment:
      API_UPSTREAM: http://financial-transaction-api:8088
    volumes:
      - ${WEB_CONFIG:-./app-financial-transaction-service/public/config.json}:/usr/share/nginx/html/config.json:ro
    networks:
      - maianet
    depends_on:
      financial-transaction-api:
        condition: service_healthy

  pg-db:
    container_name: pg-db
    image: postgres:14.12-alpine3.18
    networks:
      - maianet
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"   # 5433 on the host so it does not clash with a local Postgres on 5432
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    networks:
      - maianet
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    networks:
      - maianet
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.2
    networks:
      - maianet
    depends_on:
      - kafka
    ports:
      - "19000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092   # the in-network listener (9092 is advertised as localhost for the host only)

  maiabank-api:
    container_name: maiabank-api
    image: dowglasmaia/maiabank   # external image; tag not pinned here (owner's own image)
    networks:
      - maianet
    ports:
      - "8089:8089"

  # Mock identity provider for the automated browser tests (Node stdlib, Auth0 path layout). Started only with
  # `--profile e2e`; it never runs in a normal `docker compose up`.
  mock-idp:
    profiles: ["e2e"]
    image: node:22-alpine
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      PORT: "9099"
      PUBLIC_URL: http://mock-idp:9099
    volumes:
      - ./app-financial-transaction-service/e2e/mock-idp:/app:ro
    ports:
      - "9099:9099"
    networks:
      - maianet

networks:
  maianet:
    driver: bridge

volumes:
  postgresql_data:
