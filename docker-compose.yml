# Local development stack. Credentials come from the environment (copy .env.example to .env).
services:
  financial-transaction-api:
    build:
      context: ./api-financial-transaction-service
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: local        # enables the demo seed data (never use in production)
      DB_URL: jdbc:postgresql://pg-db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAIABANK_URL: http://maiabank-api:8089/api/v1/transactions
      AUTH_ISSUER: ${AUTH_ISSUER:-https://dev-twljocmfwpvlxx1q.eu.auth0.com/}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-https://api.financial-transaction.local}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      SEED_SECOND_SUB: ${SEED_SECOND_SUB:-}       # optional second demo customer (account 3033)
      SEED_OWNER_SUB: ${SEED_OWNER_SUB:-}        # token sub of the demo customer (local profile only)
    networks:
      - maianet
    depends_on:
      - pg-db
      - kafka

  pg-db:
    container_name: pg-db
    image: postgres:14.12-alpine3.18
    networks:
      - maianet
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    networks:
      - maianet
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    networks:
      - maianet
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.2
    networks:
      - maianet
    depends_on:
      - kafka
    ports:
      - "19000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092

  maiabank-api:
    container_name: maiabank-api
    image: dowglasmaia/maiabank   # external image; tag not pinned here (owner's own image)
    networks:
      - maianet
    ports:
      - "8089:8089"

networks:
  maianet:
    driver: bridge

volumes:
  postgresql_data:
