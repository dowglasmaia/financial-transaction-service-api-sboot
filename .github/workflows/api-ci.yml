name: api-ci

# Isolated pipeline for the backend (api-financial-transaction-service).
# Runs only when the API (or this workflow) changes.
on:
  push:
    branches: [main]
    paths:
      - 'api-financial-transaction-service/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'api-financial-transaction-service/**'
      - '.github/workflows/api-ci.yml'

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: api-financial-transaction-service

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: api-financial-transaction-service/pom.xml

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            api-financial-transaction-service/target/surefire-reports
            api-financial-transaction-service/target/site/jacoco
          if-no-files-found: ignore

  # SL-02: the contract may grow, it may not break its consumers. Compares the OpenAPI file of the pull request with the one
  # of the base branch. A deliberate breaking change needs the owner's label `breaking-contract-approved` on the PR.
  openapi-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Contract of the base branch
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          git show "origin/${{ github.base_ref }}:api-financial-transaction-service/src/main/resources/swagger/financial-transaction-openapi.yaml" > "$RUNNER_TEMP/base/openapi.yaml"

      - name: Fail on breaking changes
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'breaking-contract-approved') }}
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/base:/base:ro" \
            -v "$GITHUB_WORKSPACE/api-financial-transaction-service/src/main/resources/swagger:/head:ro" \
            openapitools/openapi-diff:2.1.0-beta.11 \
            /base/openapi.yaml /head/financial-transaction-openapi.yaml --fail-on-incompatible
