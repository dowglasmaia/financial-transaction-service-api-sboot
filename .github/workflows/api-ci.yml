name: api-ci

# Isolated pipeline for the backend (api-financial-transaction-service).
# Runs only when the API (or this workflow) changes.
on:
  push:
    branches: [main]
    paths:
      - 'api-financial-transaction-service/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'api-financial-transaction-service/**'
      - '.github/workflows/api-ci.yml'

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: api-financial-transaction-service

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'   # raised by spec BE-07 (21, then 25)
          cache: maven
          cache-dependency-path: api-financial-transaction-service/pom.xml

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            api-financial-transaction-service/target/surefire-reports
            api-financial-transaction-service/target/site/jacoco
          if-no-files-found: ignore
