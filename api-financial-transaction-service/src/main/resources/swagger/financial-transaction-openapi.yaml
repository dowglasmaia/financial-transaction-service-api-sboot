openapi: 3.0.3
info:
  title: Financial Transaction Service
  description: >-
    API for banking operations of the signed-in customer: statement, transaction detail, deposit, withdrawal,
    mobile recharge and Pix. Every operation needs a bearer token; the customer is always taken from the token.
  version: 1.1.0
servers:
  - url: /api/v1

security:
  - bearerAuth: []

paths:
  /transactions/send-pix:
    post:
      tags:
        - Transactions
      summary: Send Pix
      description: Sends a Pix from the caller's account (reserve, call the bank, confirm or give the money back).
      operationId: sendPix
      requestBody:
        description: Pix transaction data.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PixRequest'
        required: true
      responses:
        204:
          description: Pix sent
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        500:
          $ref: '#/components/responses/InternalError'

  /transactions/recharge-mobile:
    post:
      tags:
        - Transactions
      summary: Recharge Mobile
      description: Requests a mobile recharge; the debit is immediate and the carrier credit is asynchronous.
      operationId: rechargeMobile
      requestBody:
        description: Mobile recharge data.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileRechargeRequest'
        required: true
      responses:
        204:
          description: Recharge requested
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        500:
          $ref: '#/components/responses/InternalError'

  /transactions/atm-withdrawal:
    post:
      tags:
        - Transactions
      summary: Withdraw
      description: Withdraws from the caller's own account.
      operationId: withdraw
      requestBody:
        description: Withdrawal data.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
        required: true
      responses:
        204:
          description: Withdrawal registered
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        500:
          $ref: '#/components/responses/InternalError'

  /transactions/deposit:
    post:
      tags:
        - Transactions
      summary: Deposit
      description: Deposits money into an existing account (third-party deposits are allowed).
      operationId: deposit
      requestBody:
        description: Deposit data.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
        required: true
      responses:
        204:
          description: Deposit registered
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        500:
          $ref: '#/components/responses/InternalError'

  /transactions:
    get:
      tags:
        - Transactions
      summary: Get Transactions
      description: >-
        Statement of the caller's account for a period: completed operations only, with the totals of the WHOLE period
        (independent of the page and of the type filter) and the current balance. The period is half-open,
        [from 00:00, to + 1 day 00:00), in the time zone America/Sao_Paulo. Send `from` and `to` (ISO dates);
        `initial-date` and `final-date` (dd/MM/yyyy) are deprecated and mean the same period.
      operationId: getTransactions
      parameters:
        - name: from
          in: query
          description: "First day of the period (ISO date, yyyy-MM-dd)"
          required: false
          schema:
            type: string
            format: date
            example: "2026-03-10"
        - name: to
          in: query
          description: "Last day of the period, included (ISO date, yyyy-MM-dd)"
          required: false
          schema:
            type: string
            format: date
            example: "2026-03-11"
        - name: initial-date
          in: query
          deprecated: true
          description: "Deprecated, use `from`. First day of the period (format: dd/MM/yyyy)"
          required: false
          schema:
            type: string
            pattern: "^(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/([0-9]{4})$"
            example: "10/10/2024"
        - name: final-date
          in: query
          deprecated: true
          description: "Deprecated, use `to`. Last day of the period, included (format: dd/MM/yyyy)"
          required: false
          schema:
            type: string
            pattern: "^(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/([0-9]{4})$"
            example: "10/10/2024"
        - name: type
          in: query
          description: "Lists only this type of operation (the totals still cover the whole period)"
          required: false
          schema:
            type: string
            enum: [DEPOSIT, PIX, PHONE_RECHARGE, WITHDRAW]
        - name: sort
          in: query
          description: "Sort field"
          required: false
          schema:
            type: string
            enum: [date, amount]
            default: date
        - name: order
          in: query
          description: "Sort direction"
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          description: "Page number, starting at 0"
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: "Rows per page (1 to 100)"
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsResponse'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        500:
          $ref: '#/components/responses/InternalError'

  /transactions/summary:
    get:
      tags:
        - Transactions
      summary: Get the summary of a period
      description: >-
        Totals of the caller's completed operations for the same half-open period as the statement, plus one bucket
        per day (time zone America/Sao_Paulo), so a screen never has to add rows up.
      operationId: getTransactionsSummary
      parameters:
        - name: from
          in: query
          description: "First day of the period (ISO date, yyyy-MM-dd)"
          required: true
          schema:
            type: string
            format: date
            example: "2026-03-10"
        - name: to
          in: query
          description: "Last day of the period, included (ISO date, yyyy-MM-dd)"
          required: true
          schema:
            type: string
            format: date
            example: "2026-03-11"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsSummaryResponse'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        500:
          $ref: '#/components/responses/InternalError'

  /transactions/{id}:
    get:
      tags:
        - Transactions
      summary: Get Transaction
      description: One operation of the caller's account. An id that belongs to another customer behaves as an unknown one.
      operationId: getTransaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: "6c6fa8c9-743a-4c79-9cf6-e1d5e25ad4a5"
          description: The ID of the transaction to retrieve
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/InternalError'

  /accounts/me:
    get:
      tags:
        - Accounts
      summary: Get my account
      description: Account of the signed-in customer. It takes no id, the account comes from the token, so no other customer's data can be requested.
      operationId: getMyAccount
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        500:
          $ref: '#/components/responses/InternalError'

components:
  responses:
    Unauthorized:
      description: Unauthorized (no token, or a token that is not valid for this API)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseError'
    Forbidden:
      description: Forbidden (valid token, but the identity is not a customer linked to an account)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseError'
    NotFound:
      description: Not found (unknown account or transaction, or one that is not the caller's)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseError'
    UnprocessableEntity:
      description: The request is well formed but a field or a business rule is rejected (the message says which)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseError'
    InternalError:
      description: Unexpected failure (no internal detail is returned)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseError'

  schemas:
    DepositRequest:
      type: object
      required:
        - amount
        - account
        - agency
      properties:
        amount:
          type: number
          format: decimal
          example: 200.00
        account:
          type: string
          example: '1234567'
        agency:
          type: string
          example: '0001'
    PixRequest:
      type: object
      required:
        - pixKey
        - transactionAmount
        - keyType
      properties:
        pixKey:
          type: string
          example: 'pix-key-123'
        transactionAmount:
          type: number
          format: decimal
          example: 150.75
        keyType:
          type: string
          enum:
            - phone
            - email
            - cpf
          example: 'cpf'
    MobileRechargeRequest:
      type: object
      required:
        - phoneNumber
        - areaCode
        - carrier
        - amount
      properties:
        phoneNumber:
          type: integer
          example: 998877665
          minLength: 9
          maxLength: 9
        areaCode:
          type: integer
          minLength: 2
          maxLength: 2
          example: 11
        carrier:
          type: string
          enum:
            - VIVO
            - CLARO
            - TIM
            - ALGAR
          example: 'VIVO'
        amount:
          type: number
          format: decimal
          example: 50.00
    WithdrawRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          format: decimal
          example: 200.00
        agency:
          type: string
          example: '0001'
        numberAccount:
          type: string
          example: '1234567'
    TransactionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "6c6fa8c9-743a-4c79-9cf6-e1d5e25ad4a5"
        amount:
          type: number
          format: decimal
          example: 1000.00
        dateHour:
          type: string
          format: date-time
          example: '2024-05-22T10:00:00Z'
        transactionType:
          type: string
          enum: [DEPOSIT, PIX, PHONE_RECHARGE, WITHDRAW]
          example: 'PIX'
    TransactionsResponse:
      type: object
      properties:
        transaction:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResponse'
        sumIncoming:
          type: number
          format: decimal
          description: Sum of the DEPOSIT rows of the whole period
          example: 2000.00
        sumOutgoing:
          type: number
          format: decimal
          description: Sum of the PIX, PHONE_RECHARGE and WITHDRAW rows of the whole period
          example: 1500.00
        balance:
          type: number
          format: decimal
          description: Current balance of the caller's account
          example: 10500.00
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Number of rows of the period after the type filter (all pages)
          example: 42
    DailyTotal:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2026-03-10"
        incoming:
          type: number
          format: decimal
          example: 100.00
        outgoing:
          type: number
          format: decimal
          example: 35.00
    TransactionsSummaryResponse:
      type: object
      properties:
        sumIncoming:
          type: number
          format: decimal
          example: 2000.00
        sumOutgoing:
          type: number
          format: decimal
          example: 1500.00
        balance:
          type: number
          format: decimal
          example: 10500.00
        series:
          type: array
          items:
            $ref: '#/components/schemas/DailyTotal'
    ResponseError:
      type: object
      properties:
        code:
          type: string
          example: 'UNPROCESSABLE_ENTITY'
        message:
          type: string
          example: 'Dates are required: send from and to.'
    AccountResponse:
      type: object
      required:
        - agency
        - number
        - balance
      properties:
        agency:
          type: string
          example: '0211'
        number:
          type: string
          example: '2022'
        balance:
          type: number
          format: decimal
          example: 5000.00
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
