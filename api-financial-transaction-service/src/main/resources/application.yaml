server:
  port: 8088

spring:
  application:
    name: "financial-transaction-service"
  # No profile is forced here. Use SPRING_PROFILES_ACTIVE=local for development (seed data) or prod.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER:https://dev-twljocmfwpvlxx1q.eu.auth0.com/}   # the trailing slash is part of the Auth0 issuer
  jpa:
    show-sql: false
    open-in-view: true
    hibernate:
      ddl-auto: validate   # the schema belongs to Flyway (db/migration); Hibernate only validates it
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    # Required environment variables - there are no defaults on purpose (no secrets in this file)
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    admin:
      client-id: admin
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000   # ms - fail fast when MaiaBank is unreachable
            read-timeout: 5000      # ms - never hold a request thread for long

api:
  client:
    maiabank:
      url: ${MAIABANK_URL:http://localhost:8089/api/v1/transactions}

app:
  outbox:
    poll-interval-ms: 1000
  security:
    audience: ${AUTH_AUDIENCE:https://api.financial-transaction.local}
    roles-claim: ${AUTH_ROLES_CLAIM:https://financial-transaction/roles}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  seed:
    # local/test profiles only: the token subject (e.g. auth0|65f...) to link to the demo customer
    owner-subject: ${SEED_OWNER_SUB:}
    second-subject: ${SEED_SECOND_SUB:}   # optional second demo customer (account 3033) for a second login

management:
  tracing:
    sampling:
      probability: 1
  endpoint:
    health:
      show-details: when-authorized   # /actuator/health is public; its details only for role ADMIN
      roles: ADMIN
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
  metrics:
    enable:
      jvm: true
    export:
      prometheus:
        enabled: true
    tags:
      application: financial-transaction-service
    distribution:
      slo:
        http: '5ms,10ms,25ms,50ms,100ms,200ms,300ms,400ms,500ms,1s,2s'
      percentiles-histogram:
        http:
          server:
            requests: true

# Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      maiabank:
        slidingWindowType: COUNT_BASED
        registerHealthIndicator: true
        slidingWindowSize: 6
        failureRateThreshold: 50
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 80
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 3
        enableAutomaticTransitionFromOpenToClosedState: true
        transitionFromOpenToClosedStateOnSuccessfulCall: true
